name: Render videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/create-video-setup-u8t1rl

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render all videos
        run: |
          mkdir -p out
          npx remotion render ModulaireStand out/modulaire-stand.mp4
          npx remotion render Reel-Optie-1 out/reel-optie-1.mp4
          npx remotion render Reel-Optie-2 out/reel-optie-2.mp4
          npx remotion render Reel-Optie-3 out/reel-optie-3.mp4
          npx remotion render Reel-Optie-4 out/reel-optie-4.mp4
          npx remotion render Reel-Optie-5 out/reel-optie-5.mp4

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out
          retention-days: 30
