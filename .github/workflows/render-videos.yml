name: Render videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/create-video-setup-u8t1rl
    paths-ignore:
      - "**.md"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        composition:
          # 9:16 — Reels / TikTok / Stories
          - Reel-Optie-1
          - Reel-Optie-2
          - Reel-Optie-3
          - Reel-Optie-4
          - Reel-Optie-5
          # 4:5 — feed-posts
          - Reel-Optie-1-4x5
          - Reel-Optie-2-4x5
          - Reel-Optie-3-4x5
          - Reel-Optie-4-4x5
          - Reel-Optie-5-4x5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --fund=false

      - name: Convert logo (AI -> transparent PNG)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
          gs -q -dSAFER -dBATCH -dNOPAUSE -dUseCropBox \
            -sDEVICE=pngalpha -r400 \
            -sOutputFile=public/logo-white.png \
            assets/logo-white.ai
          ls -la public/logo-white.png

      - name: Render ${{ matrix.composition }}
        run: |
          mkdir -p out
          npx remotion render ${{ matrix.composition }} \
            out/${{ matrix.composition }}.mp4 \
            --concurrency=4

      - name: Upload ${{ matrix.composition }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: out/${{ matrix.composition }}.mp4
          retention-days: 30
