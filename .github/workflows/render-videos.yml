name: Render videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/create-video-setup-u8t1rl

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        composition:
          - Reel-Optie-1
          - Reel-Optie-2
          - Reel-Optie-3
          - Reel-Optie-4
          - Reel-Optie-5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --fund=false

      - name: Render ${{ matrix.composition }}
        run: |
          mkdir -p out
          npx remotion render ${{ matrix.composition }} \
            out/${{ matrix.composition }}.mp4 \
            --concurrency=4

      - name: Upload ${{ matrix.composition }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: out/${{ matrix.composition }}.mp4
          retention-days: 30
